<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-label="Ashland Public Transit">
  <defs>
    <linearGradient id="wm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="wm-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Mark tile -->
  <g>
    <rect x="16" y="16" width="128" height="128" rx="32" fill="url(#wm-bg)"/>
    <rect x="16" y="16" width="128" height="70" rx="32" fill="url(#wm-shine)"/>

    <!-- Bus glyph inside tile -->
    <g transform="translate(40 56)">
      <rect x="0" y="0" width="80" height="44" rx="8" fill="#ffffff"/>
      <path d="M4 10 L12 6 L12 20 L4 20 Z" fill="#1d4ed8" opacity="0.92"/>
      <rect x="16" y="6" width="58" height="14" rx="3" fill="#1d4ed8" opacity="0.92"/>
      <rect x="30" y="6" width="1.5" height="14" fill="#ffffff" opacity="0.9"/>
      <rect x="44" y="6" width="1.5" height="14" fill="#ffffff" opacity="0.9"/>
      <rect x="58" y="6" width="1.5" height="14" fill="#ffffff" opacity="0.9"/>
      <rect x="4" y="24" width="72" height="2" rx="1" fill="#fbbf24"/>
      <circle cx="18" cy="44" r="7" fill="#1e1b4b"/>
      <circle cx="62" cy="44" r="7" fill="#1e1b4b"/>
      <circle cx="18" cy="44" r="3" fill="#e2e8f0"/>
      <circle cx="62" cy="44" r="3" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(172 0)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="62" font-size="22" font-weight="800" letter-spacing="5" fill="#2563eb">ASHLAND</text>
    <text x="0" y="118" font-size="56" font-weight="900" letter-spacing="-1.5" fill="#0f172a">Transit</text>
    <text x="236" y="118" font-size="20" font-weight="700" fill="#64748b">· Public</text>
  </g>
</svg>
